<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>Wine Quality Predictor</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 520px;
      padding: 32px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
    }

    p.subtitle {
      margin: 0 0 24px;
      color: #6b7280;
      font-size: 0.9rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 16px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
    }

    button:hover { background: #1d4ed8; }

    .result {
      margin-top: 20px;
      padding: 14px 16px;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #065f46;
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Wine Quality Predictor</h1>
    <p class="subtitle">Enter the wine's chemical properties to predict its quality.</p>

    <form action="/predict" method="POST">
      <div class="grid">
        <div>
          <label for="fixed_acidity">Fixed Acidity</label>
          <input type="number" step="0.01" id="fixed_acidity" name="fixed_acidity" value="7.4" required />
        </div>
        <div>
          <label for="volatile_acidity">Volatile Acidity</label>
          <input type="number" step="0.01" id="volatile_acidity" name="volatile_acidity" value="0.7" required />
        </div>

        <div>
          <label for="citric_acid">Citric Acid</label>
          <input type="number" step="0.01" id="citric_acid" name="citric_acid" value="0.0" required />
        </div>
        <div>
          <label for="residual_sugar">Residual Sugar</label>
          <input type="number" step="0.01" id="residual_sugar" name="residual_sugar" value="1.9" required />
        </div>

        <div>
          <label for="chlorides">Chlorides</label>
          <input type="number" step="0.001" id="chlorides" name="chlorides" value="0.076" required />
        </div>
        <div>
          <label for="free_sulfur_dioxide">Free Sulfur Dioxide</label>
          <input type="number" step="0.01" id="free_sulfur_dioxide" name="free_sulfur_dioxide" value="11" required />
        </div>

        <div>
          <label for="total_sulfur_dioxide">Total Sulfur Dioxide</label>
          <input type="number" step="0.01" id="total_sulfur_dioxide" name="total_sulfur_dioxide" value="34" required />
        </div>
        <div>
          <label for="density">Density</label>
          <input type="number" step="0.0001" id="density" name="density" value="0.9978" required />
        </div>

        <div>
          <label for="ph">pH</label>
          <input type="number" step="0.01" id="ph" name="ph" value="3.51" required />
        </div>
        <div>
          <label for="sulphates">Sulphates</label>
          <input type="number" step="0.01" id="sulphates" name="sulphates" value="0.56" required />
        </div>

        <div>
          <label for="alcohol">Alcohol</label>
          <input type="number" step="0.01" id="alcohol" name="alcohol" value="9.4" required />
        </div>
      </div>

      <button type="submit">Predict Quality</button>
    </form>

    {% if prediction is not none %}
    <div class="result">
      <strong>Predicted quality:</strong> {{ prediction }}
    </div>
    {% endif %}
  </div>
</body>
</html>
